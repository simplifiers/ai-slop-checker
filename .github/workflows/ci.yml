name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Pattern docs are up to date
        run: python scripts/build_docs.py --check
      - name: Our README passes our own check (English)
        run: python -m slopcheck README.md --lang en --fail-on revise
      - name: Our README passes our own check (German)
        run: python -m slopcheck README.de.md --lang de --fail-on revise
      - name: Skill copy is up to date
        run: python scripts/build_skill.py --check
