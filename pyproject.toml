[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-slop-checker"
version = "0.1.0"
description = "AI slop checker for German and English: a deterministic check of AI-assisted expert texts for missing substance, unsourced facts, stock phrases, structure, measured rhythm and form."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sebastian Hertlein, Simplifiers AI" }]
keywords = ["ai-slop", "ai slop checker", "slop", "writing", "editing", "ai", "linter", "german", "content", "quality"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: German",
    "Natural Language :: English",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/simplifiers/ai-slop-checker"
Issues = "https://github.com/simplifiers/ai-slop-checker/issues"

[project.scripts]
slop-check = "slopcheck.cli:main"
ai-slop-checker = "slopcheck.cli:main"

[tool.setuptools]
packages = ["slopcheck", "slopcheck.checks"]

[tool.setuptools.package-data]
slopcheck = ["patterns/*.json", "bands/*.json"]
